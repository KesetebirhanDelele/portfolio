# This container runs on Compose's normal default network (not
# network_mode: host — see docker-compose.yml's comment on why that's no
# longer needed as of PROGRESS.md M101/M102) and reaches the backend at
# backend:5000 over Docker DNS, published to the host on 80/443 via an
# explicit port mapping instead.
#
# TLS via a real domain (2026-09-16): repo2reputation.colaberry.com,
# A-record pointed at this server's IP by Ali. Replaces the 157.180.43.42.nip.io
# stopgap (deployment.md's "Path to real production" TLS section,
# 2026-08-16) now that Kes/Ali decided on a domain — nip.io is retired, its
# cert files are left on disk unused rather than deleted (harmless, avoids a
# needless certbot revoke). noVNC (the Colaberry live-login video stream)
# refuses to run outside a secure context, which a bare-IP plain-HTTP origin
# never satisfies — TLS here is what actually unblocks that feature, not
# just a "not secure" cosmetic fix. All plain-HTTP traffic redirects to the
# HTTPS origin so nobody lands on an insecure context by accident.
server {
    listen 80;
    server_name _;
    return 301 https://repo2reputation.colaberry.com$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/repo2reputation.colaberry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo2reputation.colaberry.com/privkey.pem;

    # /api/* stays on the same origin as the frontend, so the browser never
    # needs CORS configured at all — see deployment.md's URL topology
    # decision. Includes WebSocket upgrade support for the Colaberry
    # live-login stream (backend/services/colaberryLiveLoginWsProxy.js,
    # path /api/colaberry-login/:sessionId/stream).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # React Router (client-side routing) — unknown paths fall back to
        # index.html rather than a raw nginx 404.
        try_files $uri /index.html;
    }
}
