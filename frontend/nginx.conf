# This container runs with network_mode: host (see docker-compose.yml) for
# the same reason the backend does: it needs to reach the backend at
# 127.0.0.1:5000 on the HOST's loopback, which only resolves correctly to
# the backend's actual port under host networking — see deployment.md's
# "Colaberry live-login" section for the full explanation.
#
# TLS via nip.io (deployment.md's "Path to real production" TLS stopgap,
# 2026-08-16): 46.62.228.67.nip.io resolves straight back to this server's
# own IP, so Let's Encrypt's HTTP-01 challenge works without owning a real
# domain — a genuinely trusted cert (no browser warning), not self-signed.
# This is explicitly a stopgap: swap for a real domain's cert when Kes/Ali
# decide on one; the cert path below just needs updating to match.
# noVNC (the Colaberry live-login video stream) refuses to run outside a
# secure context, which a bare-IP plain-HTTP origin never satisfies — this
# is what actually unblocks that feature, not just a "not secure" cosmetic
# fix. All plain-HTTP traffic, including hits on the bare IP directly,
# redirects to the HTTPS nip.io origin so nobody lands on an insecure
# context by accident.
server {
    listen 80;
    server_name _;
    return 301 https://46.62.228.67.nip.io$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/46.62.228.67.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46.62.228.67.nip.io/privkey.pem;

    # /api/* stays on the same origin as the frontend, so the browser never
    # needs CORS configured at all — see deployment.md's URL topology
    # decision. Includes WebSocket upgrade support for the Colaberry
    # live-login stream (backend/services/colaberryLiveLoginWsProxy.js,
    # path /api/colaberry-login/:sessionId/stream).
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # React Router (client-side routing) — unknown paths fall back to
        # index.html rather than a raw nginx 404.
        try_files $uri /index.html;
    }
}
