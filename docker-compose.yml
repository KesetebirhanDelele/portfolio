services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback-only, for host-side admin convenience (docker compose exec /
    # an external psql client on the box itself) — never bound to 0.0.0.0,
    # not reachable off this host. Other containers reach this by service
    # name (postgres:5432) over Compose's own default network, not through
    # this published port at all.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    # Host-side port is configurable (REDIS_HOST_PORT, defaults to 6379) —
    # this dev machine already runs an unrelated project's Redis on 6379
    # (see PROGRESS.md M66, same collision, same fix). The Hetzner server
    # will be a clean host, so the default applies there unmodified.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: runs migrations, exits. Same default Compose network as every
  # other service now — reaches postgres by service name.
  migrate:
    build:
      context: ./backend
    command: ["npm", "run", "migrate:up"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Normal, isolated Compose networking (no network_mode: host, no Docker
  # socket mount) — this used to be required for Colaberry live-login,
  # which spawned sibling containers over a mounted host socket and needed
  # the backend's own 127.0.0.1 to BE the host's loopback to reach them.
  # As of PROGRESS.md M101/M102, Colaberry project import is SQL-only and
  # never drives that feature at all; it's structurally unreachable through
  # the UI (see PROGRESS.md M105-adjacent investigation, same session).
  # Dropping the socket mount removes what was, by deployment.md's own
  # description, "root-equivalent host access from inside the backend
  # container if it's ever compromised" — a real hardening, not just a
  # simplification. Reaches postgres/redis by service name now, not
  # localhost, since it's no longer sharing the host's network namespace.
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Hits the same GET /api/health that healthMonitor.js samples internally
    # — a container's own 127.0.0.1 always means itself, regardless of
    # network mode, so this didn't need to change.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Publicly reachable on the host's ports 80/443 (Hetzner Firewall gates
  # this, not Compose) — now via an explicit port mapping instead of
  # network_mode: host, since it no longer needs to share the host's
  # loopback to reach the backend (that's `backend:5000` over Docker DNS
  # now — see nginx.conf). TLS terminates here via a nip.io Let's Encrypt
  # cert (deployment.md's TLS stopgap, 2026-08-16) — certs live on the host
  # at /etc/letsencrypt (certbot manages renewal there) and are mounted
  # read-only so a container rebuild never needs to bake in cert material.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    # nginx:alpine ships wget (busybox), not curl. --no-check-certificate
    # because the nip.io cert's CN doesn't match the bare IP this hits
    # itself as — that's expected for a self-probe, not a real trust issue
    # (the cert is still real Let's Encrypt for actual external visitors).
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
